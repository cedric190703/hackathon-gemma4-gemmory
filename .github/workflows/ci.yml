name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests, lint and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Android Lint
        run: ./gradlew lint --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      # The 2.5 GB model is never needed here: RealModelInferenceTest skips
      # itself when the artefact is absent, and every other test uses FakeLlmEngine.
      - name: Guard against committed model weights
        run: |
          if git ls-files | grep -E '\.(litertlm|task|tflite)$'; then
            echo "::error::model weights must never be committed"
            exit 1
          fi

      - name: Guard against hard-coded local paths
        run: |
          if git ls-files '*.kt' '*.kts' '*.xml' '*.md' \
             | xargs grep -nE '/Users/[a-zA-Z0-9._-]+/|/home/[a-zA-Z0-9._-]+/' ; then
            echo "::error::hard-coded developer machine path found"
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
          if-no-files-found: ignore
